# 瞭望塔的 nginx 配置片段
# 1) 限流区（必须放 http 段，放 conf.d/ 里）
#
#    面板开着会自动轮询，所以浏览请求要放宽到 60r/m；
#    5r/m 那档留给登录接口之类。

limit_req_zone $real_client_ip zone=panel_page:10m rate=60r/m;


# 2) server 块
#
#    ★ 面板在 Cloudflare 隧道后面时，$remote_addr 恒为 127.0.0.1，
#      真实客户端 IP 要从 CF-Connecting-IP 头取。

server {
    listen 127.0.0.1:8091;              # 只听本机，公网经隧道进来
    server_name _;

    # 第一道门：HTTP Basic
    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # 正常浏览限流（面板会自己轮询，别太紧）
    limit_req zone=panel_page burst=40 nodelay;
    limit_req_status 429;

    # 日志：panel_auth 格式（真实 IP + UA 拆字段，给人看）
    access_log /var/log/nginx/panel-auth.log panel_auth;
    error_log  /var/log/nginx/panel.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
