# 面板的 nginx HTTP Basic 认证失败
# 装到 /etc/fail2ban/filter.d/panel-auth.conf
#
# ★ 日志源是 nginx 的 ERROR log，不是 access log：
#   nginx 在 auth_basic 失败时会在 error_log 记
#   user "xxx": password mismatch, client: <IP>, server: ..., request: "..."
#   access_log 里只有状态码 401，匹配不到。
[Definition]
failregex = ^\s*\[error\] \d+#\d+: \*\d+ user "(?:[^"]+|.*?)":? (?:password mismatch|was not found in "[^\"]*"), client: (?P<ip>\S+), server: \S*, request: "\S+ \S+ HTTP/\d+\.\d+", host: "\S+"(?:, referrer: "\S+")?\s*$
ignoreregex =
